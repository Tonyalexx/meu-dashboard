<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MT5 Backtest Dashboard - Neon Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --neon-cyan: #66fcf1;
      --neon-green: #00ff66;
      --neon-red: #ff0055;
      --text-color: #c5c6c7;
      --text-white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(102, 252, 241, 0.5), 0 0 20px rgba(102, 252, 241, 0.3);
      letter-spacing: 2px;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(102, 252, 241, 0.2);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: var(--neon-cyan);
    }
    .card h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8892b0;
      margin-bottom: 10px;
    }
    .card .value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--text-white);
    }
    .val-positive { color: var(--neon-green) !important; text-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
    .val-negative { color: var(--neon-red) !important; text-shadow: 0 0 8px rgba(255, 0, 85, 0.4); }

    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(102, 252, 241, 0.2);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }
    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    th {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--neon-cyan);
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.2);
    }
    tr:hover { background: rgba(102, 252, 241, 0.03); }
    
    .loading {
      text-align: center;
      font-size: 1.2rem;
      color: var(--neon-cyan);
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ MT5 BACKTEST DASHBOARD</h1>
  </header>

  <div class="cards-container">
    <div class="card">
      <h3>Lucro Líquido Acumulado</h3>
      <div id="card-lucro" class="value">--</div>
    </div>
    <div class="card">
      <h3>Total de Backtests</h3>
      <div id="card-total" class="value">--</div>
    </div>
    <div class="card">
      <h3>Fator de Lucro Média</h3>
      <div id="card-pf" class="value">--</div>
    </div>
    <div class="card">
      <h3>Drawdown Máx Média</h3>
      <div id="card-dd" class="value">--</div>
    </div>
  </div>

  <div class="table-container">
    <div id="loading" class="loading">Carregando dados da planilha...</div>
    <table id="data-table" style="display:none;">
      <thead>
        <tr>
          <th>Data / Hora</th>
          <th>Lucro Líquido</th>
          <th>Lucro Bruto</th>
          <th>Perda Bruta</th>
          <th>Profit Factor</th>
          <th>Drawdown</th>
          <th>Operações</th>
          <th>% Vitória</th>
          <th>% Derrota</th>
          <th>Ativo</th>
          <th>Timeframe</th>
          <th>Estratégia</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSnal0cSHx4_QoyubFzEMQiM2VPt1oIvdJcNsmz9mWJXunG4yZGdup9-DfuBuJQLGe1henVi3evil_k/pub?output=csv';

    async function fetchData() {
      try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        const rows = data.split('\n').map(row => row.trim()).filter(row => row.length > 0);
        
        if (rows.length === 0) return;

        let totalLucro = 0;
        let totalBacktests = 0;
        let sumPF = 0;
        let sumDD = 0;

        const tableBody = document.getElementById('table-body');
        tableBody.innerHTML = '';

        // Ignora o cabeçalho se houver, ou lê todas as linhas de dados
        const startIdx = isNaN(parseFloat(rows[0].split(',')[1])) ? 1 : 0;

        for (let i = startIdx; i < rows.length; i++) {
          const cols = rows[i].split(',');
          if (cols.length < 2) continue;

          const lucro = parseFloat(cols[1]) || 0;
          const pf = parseFloat(cols[4]) || 0;
          const dd = parseFloat(cols[5]) || 0;

          totalLucro += lucro;
          totalBacktests++;
          sumPF += pf;
          sumDD += dd;

          const tr = document.createElement('tr');
          const lucroClass = lucro >= 0 ? 'val-positive' : 'val-negative';

          tr.innerHTML = `
            <td>${cols[0] || '-'}</td>
            <td class="${lucroClass}">$ ${lucro.toFixed(2)}</td>
            <td>${cols[2] || '-'}</td>
            <td>${cols[3] || '-'}</td>
            <td>${cols[4] || '-'}</td>
            <td>${cols[5] || '-'}</td>
            <td>${cols[6] || '-'}</td>
            <td>${cols[7] || '-'}</td>
            <td>${cols[8] || '-'}</td>
            <td>${cols[9] || '-'}</td>
            <td>${cols[10] || '-'}</td>
            <td>${cols[11] || '-'}</td>
          `;
          tableBody.appendChild(tr);
        }

        // Atualiza os Cards do topo
        const cardLucro = document.getElementById('card-lucro');
        cardLucro.innerText = `$ ${totalLucro.toFixed(2)}`;
        cardLucro.className = `value ${totalLucro >= 0 ? 'val-positive' : 'val-negative'}`;

        document.getElementById('card-total').innerText = totalBacktests;
        document.getElementById('card-pf').innerText = totalBacktests > 0 ? (sumPF / totalBacktests).toFixed(2) : '--';
        document.getElementById('card-dd').innerText = totalBacktests > 0 ? `${(sumDD / totalBacktests).toFixed(2)}%` : '--';

        document.getElementById('loading').style.display = 'none';
        document.getElementById('data-table').style.display = 'table';

      } catch (err) {
        document.getElementById('loading').innerText = 'Erro ao carregar os dados. Verifique o link da planilha.';
        console.error(err);
      }
    }

    fetchData();
    // Atualiza os dados a cada 30 segundos automaticamente
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
