<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAUUSD - Strategy Optimizer</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            darkBg: '#090d14', cardBg: '#111823', cardBorder: '#1e293b',
            accentCyan: '#00f2fe', accentBlue: '#0284c7',
            accentGreen: '#00ff87', accentRed: '#ff1744',
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #090d14; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .font-num { font-family: 'Space Grotesk', sans-serif; font-size: 16px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d14; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    .glow-cyan { box-shadow: 0 0 18px rgba(0, 242, 254, 0.2); }
    .neon-red-text { color: #ff1744; text-shadow: 0 0 10px rgba(255, 23, 68, 0.9), 0 0 20px rgba(255, 23, 68, 0.6); }

    /* ===== TABELA EM RETÂNGULOS (CARDS) ===== */
    .custom-table { border-collapse: separate; border-spacing: 0 18px; width: 100%; }
    .custom-table th {
      text-align: center; vertical-align: middle; white-space: nowrap;
      padding: 12px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    }
    .custom-table td {
      text-align: center; vertical-align: middle; white-space: nowrap;
      padding: 22px 18px; background-color: #0f1a2b;
      font-family: 'Space Grotesk', sans-serif; font-size: 16px; letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      border-top: 1.5px solid #25354e; border-bottom: 1.5px solid #25354e;
    }
    .custom-table tbody tr td:first-child {
      border-left: 1.5px solid #25354e; border-top-left-radius: 12px; border-bottom-left-radius: 12px;
    }
    .custom-table tbody tr td:last-child {
      border-right: 1.5px solid #25354e; border-top-right-radius: 12px; border-bottom-right-radius: 12px;
    }
    .custom-table tbody tr:hover td {
      background-color: #1b2942; border-color: #00f2fe;
      box-shadow: 0 4px 22px rgba(0, 242, 254, 0.15); transition: all 0.2s ease;
    }
    .custom-table td.params-cell {
      white-space: normal; text-align: left; min-width: 340px; max-width: 520px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #94a3b8;
      line-height: 1.7; padding: 14px 16px; letter-spacing: 0;
    }
    .custom-table.tight { border-spacing: 0; }
    .custom-table.tight tr.pt td { border-bottom: none; border-bottom-left-radius: 0 !important; border-bottom-right-radius: 0 !important; }
    .custom-table.tight tr.pb td {
      border-top: none; border-left: 1.5px solid #25354e; border-right: 1.5px solid #25354e;
      border-radius: 0 0 12px 12px; min-width: 0; max-width: none; padding: 4px 18px 16px;
    }
    .custom-table.tight tr.sp td { background: none; border: none !important; padding: 0; height: 18px; border-radius: 0 !important; box-shadow: none !important; }
    .custom-table.tight tr.pt:hover td, .custom-table.tight tr.pt:hover + tr.pb td {
      background-color: #1b2942; border-color: #00f2fe; box-shadow: none;
    }

    /* ===== LINHA SELECIONADA (clique) ===== */
    .custom-table tbody tr.pt, .custom-table tbody tr.pb { cursor: pointer; }
    .custom-table:not(.tight) tbody tr { cursor: pointer; }
    .custom-table tbody tr.sel td {
      background-color: #1b2942; border-color: #00f2fe;
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.25);
    }
    .custom-table.tight tbody tr.sel td { box-shadow: none; }

    .ptag {
      display: inline-block; background: #0b1220; border: 1px solid #25354e; border-radius: 6px;
      padding: 1px 6px; margin: 2px 3px 2px 0; color: #cbd5e1;
    }
    .ptag b { color: #fbbf24; font-weight: 600; }
    .val-positive { color: #00ff87; font-weight: 700; }
    .val-negative { color: #ff1744; font-weight: 700; }
    .val-cyan { color: #00f2fe; font-weight: 700; }

    /* ===== BOTÃO APAGAR (bolinha vermelha com X) ===== */
    .del-btn {
      width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
      background: #ff1744; color: #fff; font-size: 15px; font-weight: 700; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; transition: all 0.18s ease;
    }
    .del-btn:hover { transform: scale(1.15); box-shadow: 0 0 14px rgba(255, 23, 68, 0.7); }

    /* ===== BOTÃO EXCLUIR TUDO (retangular vermelho) ===== */
    .del-all-btn {
      background: #ff1744; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
      padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; white-space: nowrap;
      transition: all 0.18s ease;
    }
    .del-all-btn:hover { filter: brightness(1.12); box-shadow: 0 0 14px rgba(255, 23, 68, 0.7); }
    .del-all-btn:disabled { opacity: 0.6; cursor: wait; }

    /* ===== PAINEL DE FILTROS ===== */
    .fcard {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.55));
      border: 1px solid #1e293b; border-radius: 16px; padding: 18px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .fcard-head { display: flex; align-items: center; gap: 10px; }
    .fcard-icon {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fb7185; font-size: 13px;
    }
    .fcard-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #cbd5e1; }
    .off-btn {
      margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      padding: 4px 10px; border-radius: 999px; background: #0b1220;
      border: 1px solid #1e293b; color: #64748b; cursor: pointer; transition: all 0.18s ease;
    }
    .off-btn:hover { color: #fff; border-color: rgba(244, 63, 94, 0.55); }
    .off-btn.active {
      color: #fff; border-color: #f43f5e;
      background: linear-gradient(135deg, #e11d48, #f43f5e); box-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
    }
    .chip {
      background: #0b1220; border: 1px solid #1e293b; color: #94a3b8; font-weight: 600;
      border-radius: 10px; cursor: pointer; transition: all 0.18s ease; text-align: center;
    }
    .chip:hover { color: #fff; border-color: rgba(244, 63, 94, 0.55); background: rgba(244, 63, 94, 0.08); transform: translateY(-1px); }
    .chip.active {
      color: #fff; border-color: #f43f5e;
      background: linear-gradient(135deg, #e11d48, #f43f5e); box-shadow: 0 0 14px rgba(244, 63, 94, 0.55);
    }
    .tf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tf-grid .chip { padding: 14px 0; font-size: 15px; }
    .hour-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .hour-grid .chip { padding: 8px 0; font-size: 11px; border-radius: 8px; }
    .period-wrap { display: flex; flex-wrap: wrap; gap: 10px; }
    .period-wrap .chip { padding: 11px 18px; font-size: 13px; border-radius: 999px; }
    @media (max-width: 520px) { .hour-grid { grid-template-columns: repeat(4, 1fr); } }

    /* ===== ABAS ===== */
    .tab-btn {
      padding: 10px 22px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
      border-radius: 12px; background: #0b1220; border: 1px solid #1e293b; color: #94a3b8;
      cursor: pointer; transition: all 0.18s ease;
    }
    .tab-btn:hover { color: #fff; border-color: rgba(0, 242, 254, 0.5); }
    .tab-btn.active {
      color: #00f2fe; border-color: #00f2fe; background: rgba(0, 242, 254, 0.08);
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.25);
    }
    .tab-count {
      margin-left: 8px; font-size: 11px; background: #1e293b; color: #cbd5e1;
      padding: 2px 8px; border-radius: 999px;
    }
    .opt-select {
      background: #0b1220; border: 1px solid #1e293b; color: #e2e8f0; border-radius: 10px;
      padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .opt-select:focus { outline: none; border-color: #00f2fe; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden text-sm">

  <!-- HEADER -->
  <header class="bg-cardBg border-b border-cardBorder px-6 py-3 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-rose-600 to-red-500 flex items-center justify-center text-white font-bold shadow-lg shadow-rose-500/40">
        <i class="fa-solid font-bold fa-compass"></i>
      </div>
      <span class="text-xl font-extrabold tracking-wider neon-red-text">XAUUSD</span>
      <span class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">MT5 Live Dashboard</span>
    </div>
    <div class="flex items-center space-x-3">
      <span id="sync-status" class="flex items-center space-x-1.5 text-xs text-emerald-400 bg-emerald-950/60 px-3 py-1.5 rounded-lg border border-emerald-500/40">
        <i class="fa-solid fa-circle-dot text-[10px] animate-pulse"></i>
        <span id="sync-text">Google Sheets Connected</span>
      </span>
      <div class="flex items-center space-x-2 border-l border-slate-800 pl-3">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Tony" class="w-8 h-8 rounded-full border border-cyan-500/50" onerror="this.src='https://placehold.co/100x100/111823/00f2fe?text=TA'">
        <span class="font-medium text-slate-200 hidden sm:inline text-xs">Tony Alex</span>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 p-4 md:p-6 space-y-6 max-w-[1800px] mx-auto w-full">

    <!-- ABAS -->
    <div class="flex gap-3">
      <button id="tab-bt" onclick="switchTab('bt')" class="tab-btn active"><i class="fa-solid fa-chart-line mr-2"></i>BACKTESTS<span id="count-bt" class="tab-count">0</span></button>
      <button id="tab-op" onclick="switchTab('op')" class="tab-btn"><i class="fa-solid fa-dna mr-2"></i>OTIMIZAÇÃO<span id="count-op" class="tab-count">0</span></button>
    </div>

    <!-- As duas visões são montadas pelo JavaScript com o mesmo layout -->
    <div id="view-bt" class="space-y-6"></div>
    <div id="view-op" class="space-y-6 hidden"></div>

  </main>

  <div id="del-modal" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/70">
    <div class="bg-cardBg border border-cardBorder rounded-2xl p-6 w-[90%] max-w-sm text-center space-y-5">
      <div class="w-12 h-12 mx-auto rounded-full bg-[#ff1744] flex items-center justify-center text-white text-xl font-bold">✕</div>
      <p id="del-title" class="text-base font-semibold text-slate-100">Você deseja apagar este resultado?</p>
      <p id="del-sub" class="text-xs text-slate-400">Ele será removido da planilha e não dá para desfazer.</p>
      <div class="flex gap-3 justify-center">
        <button onclick="closeDelete()" class="chip px-6 py-2.5 text-sm">Não</button>
        <button id="del-confirm" onclick="confirmDelete()" class="px-6 py-2.5 text-sm font-bold rounded-[10px] text-white bg-[#ff1744] hover:brightness-110 transition">Sim, apagar</button>
      </div>
    </div>
  </div>

  <footer class="bg-cardBg border-t border-cardBorder px-6 py-3 text-center text-xs text-slate-500">
    XAUUSD &copy; 2026 - MT5 Automated Strategy Optimizer & Google Sheets Live Pipeline
  </footer>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSnal0cSHx4_QoyubFzEMQiM2VPt1oIvdJcNsmz9mWJXunG4yZGdup9-DfuBuJQLGe1henVi3evil_k/pub?output=csv';
    const DELETE_URL = 'https://script.google.com/macros/s/AKfycbzkn7Z4eSCqS4DtH7q_jvFeLT87LpNb5_yZeRN1oDNiuyWIQOzLJorTBu9ln6LYKYTP6g/exec';
    const DELETE_TOKEN = 'Tony123.';
    const deletedKeys = new Set();
    let rowToDelete = null;
    let currentTab = 'bt';

    // Estado de cada visão: bt = backtests (individual), op = otimização (genética)
    const S = {
      bt: { rows: [], visible: [], tf: null, hour: null, period: null, chart: null, selected: null },
      op: { rows: [], visible: [], tf: null, hour: null, period: null, chart: null, selected: null,
            sort: 'lucroLiquido', limit: 100, allParams: false }
    };

    const CFG = {
      bt: {
        kpi1: 'Lucro Líquido Acumulado', kpi2: 'Total de Backtests',
        chartTitle: 'Curva de Capital (Equity Curve) - Lucro Líquido Acumulado',
        chartSub: 'Evolução dos resultados em tempo real baseada nos envios do MetaTrader 5',
        chartLabel: 'Lucro Líquido Acumulado',
        tableTitle: 'Resultados Detalhados dos Backtests',
        tableSub: 'Sincronizado automaticamente da planilha do Google Sheets. Clique em um resultado para ver só ele.'
      },
      op: {
        kpi1: 'Melhor Lucro Líquido', kpi2: 'Total de Passes da Genética',
        chartTitle: 'Curva de Capital - Lucro Líquido de cada Passe da Otimização',
        chartSub: 'Cada ponto é um passe da otimização genética, na mesma ordem da tabela abaixo',
        chartLabel: 'Lucro Líquido do Passe',
        tableTitle: 'Resultados Detalhados da Otimização (Genética)',
        tableSub: 'Cada linha é um passe do algoritmo genético do MT5. Clique em um passe para ver só ele.'
      }
    };

    // ---------- Montagem do layout (igual para as duas visões) ----------
    function viewHTML(p) {
      const c = CFG[p];
      const isOp = (p === 'op');
      const head = ['Data / Hora', 'Lucro Líquido', 'Drawdown', 'Maior Lucro', 'Maior Perda',
        'Ganhos Consec.', 'Perdas Consec.', 'Operações', 'Sharpe', '% Vitória', 'Fator EA', 'Timeframe']
        .map(h => `<th>${h}</th>`).join('') + '<th></th>';

      const controls = isOp ? `
        <div class="flex flex-wrap items-center gap-4">
          <div class="flex items-center gap-2">
            <span class="text-xs uppercase font-bold text-slate-400 tracking-wider">Ordenar por</span>
            <select class="opt-select" onchange="S.op.sort=this.value; render('op')">
              <option value="lucroLiquido">Lucro Líquido (maior)</option>
              <option value="sharpe">Sharpe (maior)</option>
              <option value="drawdown">Drawdown (menor)</option>
              <option value="pctVitoria">% Vitória (maior)</option>
              <option value="fatorEA">Fator EA (maior)</option>
              <option value="operacoes">Operações (maior)</option>
              <option value="maiorPerda">Maior Perda (menos negativa)</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs uppercase font-bold text-slate-400 tracking-wider">Mostrar</span>
            <select class="opt-select" onchange="S.op.limit=Number(this.value); render('op')">
              <option value="50">Top 50</option>
              <option value="100" selected>Top 100</option>
              <option value="500">Top 500</option>
              <option value="0">Todos</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs uppercase font-bold text-slate-400 tracking-wider">Parâmetros</span>
            <button id="op-params-toggle" onclick="toggleParams()" class="chip px-4 py-2 text-xs">Só os que variam</button>
          </div>
          <span id="op-info" class="ml-auto text-xs text-slate-400"></span>
        </div>` : '';

      return `
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-cardBg border border-cyan-500/30 rounded-xl p-4 flex justify-between items-start glow-cyan">
          <div class="space-y-1">
            <p class="text-xs uppercase font-semibold text-slate-400">${c.kpi1}</p>
            <h2 class="text-3xl font-extrabold text-white font-mono tracking-tight" id="${p}-kpi-profit">$ 0.00</h2>
          </div>
          <div class="p-2.5 rounded-lg bg-cyan-950/50 border border-cyan-500/40 text-cyan-400"><i class="fa-solid fa-arrow-trend-up text-lg"></i></div>
        </div>
        <div class="bg-cardBg border border-cardBorder rounded-xl p-4 flex justify-between items-start">
          <div class="space-y-1">
            <p class="text-xs uppercase font-semibold text-slate-400">${c.kpi2}</p>
            <h2 class="text-3xl font-extrabold text-white font-mono tracking-tight" id="${p}-kpi-total">0</h2>
          </div>
          <div class="p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300"><i class="fa-solid fa-database text-lg"></i></div>
        </div>
        <div class="bg-cardBg border border-emerald-500/30 rounded-xl p-4 flex justify-between items-start">
          <div class="space-y-1">
            <p class="text-xs uppercase font-semibold text-slate-400">Sharpe Médio</p>
            <h2 class="text-3xl font-extrabold text-white font-mono tracking-tight" id="${p}-kpi-sharpe">0.00</h2>
          </div>
          <div class="p-2.5 rounded-lg bg-emerald-950/50 border border-emerald-500/40 text-[#00ff87]"><i class="fa-solid fa-shield-halved text-lg"></i></div>
        </div>
        <div class="bg-cardBg border border-rose-500/30 rounded-xl p-4 flex justify-between items-start">
          <div class="space-y-1">
            <p class="text-xs uppercase font-semibold text-slate-400">Rebaixamento Médio</p>
            <h2 class="text-3xl font-extrabold text-[#ff1744] font-mono tracking-tight" id="${p}-kpi-dd">0.00%</h2>
          </div>
          <div class="p-2.5 rounded-lg bg-rose-950/50 border border-rose-500/40 text-[#ff1744]"><i class="fa-solid fa-triangle-exclamation text-lg"></i></div>
        </div>
      </div>

      <div class="bg-cardBg border border-cardBorder rounded-xl p-4 flex flex-col justify-between relative">
        <div class="mb-4">
          <h3 class="font-bold text-base text-slate-100">${c.chartTitle}</h3>
          <p class="text-xs text-slate-400 mt-0.5">${c.chartSub}</p>
        </div>
        <div class="h-80 w-full relative"><canvas id="${p}-chart"></canvas></div>
      </div>

      <div class="bg-cardBg border border-cardBorder rounded-xl p-4 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-sliders text-rose-500"></i>
            <h3 class="font-bold text-base text-slate-100">Painel de Filtros</h3>
          </div>
          <span class="text-xs text-slate-400">Selecione para filtrar estratégias</span>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="fcard">
            <div class="fcard-head">
              <div class="fcard-icon"><i class="fa-regular fa-clock"></i></div>
              <span class="fcard-title">Timeframe</span>
              <button id="${p}-off-tf" onclick="setOff('${p}','tf')" class="off-btn active">OFF</button>
            </div>
            <div class="tf-grid" id="${p}-tf-container">
              <button onclick="selTF('${p}','M1')" data-v="M1" class="chip">M1</button>
              <button onclick="selTF('${p}','M5')" data-v="M5" class="chip">M5</button>
              <button onclick="selTF('${p}','M15')" data-v="M15" class="chip">M15</button>
            </div>
          </div>
          <div class="fcard">
            <div class="fcard-head">
              <div class="fcard-icon"><i class="fa-solid fa-hourglass-half"></i></div>
              <span class="fcard-title">Horário (Hora de Início)</span>
              <button id="${p}-off-hour" onclick="setOff('${p}','hour')" class="off-btn active">OFF</button>
            </div>
            <div class="hour-grid" id="${p}-hour-container">
              ${Array.from({ length: 24 }, (_, i) =>
                `<button onclick="selHour('${p}',${i})" data-v="${i}" class="chip">${String(i).padStart(2, '0')}:00</button>`).join('')}
            </div>
          </div>
          <div class="fcard">
            <div class="fcard-head">
              <div class="fcard-icon"><i class="fa-regular fa-calendar-days"></i></div>
              <span class="fcard-title">Período</span>
              <button id="${p}-off-period" onclick="setOff('${p}','period')" class="off-btn active">OFF</button>
            </div>
            <div class="period-wrap" id="${p}-period-container">
              ${['1 Ano', '6 Meses', '3 Meses', '1 Mês', '1 Semana'].map(t =>
                `<button onclick="selPeriod('${p}','${t}')" data-v="${t}" class="chip">${t}</button>`).join('')}
            </div>
          </div>
        </div>
      </div>

      <div class="bg-cardBg border border-cardBorder rounded-xl p-4 space-y-4">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h3 class="font-bold text-base text-slate-100">${c.tableTitle}</h3>
            <p class="text-xs text-slate-400">${c.tableSub}</p>
          </div>
          <button onclick="askDeleteAll('${p}')" class="del-all-btn" title="Apagar todos os resultados desta aba">
            <i class="fa-solid fa-trash mr-2"></i>EXCLUIR TUDO
          </button>
        </div>
        ${controls}
        <div class="overflow-x-auto">
          <table class="custom-table text-xs ${isOp ? 'tight' : ''}">
            <thead><tr class="text-cyan-400 font-semibold uppercase">${head}</tr></thead>
            <tbody id="${p}-body" class="font-medium"></tbody>
          </table>
        </div>
      </div>`;
    }

    // ---------- Utilidades ----------
    function parseCSVLine(line) {
      const out = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (ch === ',' && !inQuotes) {
          out.push(cur); cur = '';
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out.map(c => c.trim());
    }

    function cleanNum(val) {
      if (val === null || val === undefined || val === '') return 0;
      let s = val.toString().replace(/\s/g, '').replace(/[^0-9.,-]/g, '');
      if (!/\d/.test(s)) return 0;
      if (s.includes(',') && s.includes('.')) {
        if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
        else s = s.replace(/,/g, '');
      } else if (s.includes(',')) {
        s = s.replace(',', '.');
      }
      const dots = s.split('.');
      if (dots.length > 2) s = dots.slice(0, -1).join('') + '.' + dots[dots.length - 1];
      return parseFloat(s) || 0;
    }

    const fmtMoney = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // "Nome=valor||inicio||passo||fim||flag"  ou  "Nome=valor"  ->  { Nome: valor }
    function parseParams(str) {
      const map = {};
      if (!str) return map;
      str.split(';').forEach(part => {
        const p = part.trim().split('||')[0].trim();
        if (!p) return;
        const i = p.indexOf('=');
        if (i <= 0) return;
        map[p.slice(0, i).trim()] = p.slice(i + 1).trim();
      });
      return map;
    }

    // Horas em que o passe opera (Horário 1/2/3 ligados)
    function horasDoPasse(params) {
      const set = new Set();
      [1, 2, 3].forEach(n => {
        const h = parseInt(params['InpHora' + n], 10);
        if (params['InpHora' + n + '_On'] === '1' && h >= 0 && h <= 23) set.add(h);
      });
      return set;
    }

    function rowKey(r) {
      return [r.dataHora, r.timeframe, r.lucroLiquido.toFixed(2), r.operacoes].join('|');
    }

    // Chave única usada para marcar o resultado clicado
    function selKey(r) { return rowKey(r) + '|' + (r.passe || ''); }

    // ---------- Abas ----------
    function switchTab(t) {
      currentTab = t;
      document.getElementById('view-bt').classList.toggle('hidden', t !== 'bt');
      document.getElementById('view-op').classList.toggle('hidden', t !== 'op');
      document.getElementById('tab-bt').classList.toggle('active', t === 'bt');
      document.getElementById('tab-op').classList.toggle('active', t === 'op');
      if (S[t].chart) S[t].chart.resize();
    }

    // ---------- Filtros ----------
    function updateFilterUI(p) {
      const st = S[p];
      document.querySelectorAll(`#${p}-tf-container .chip`).forEach(b => b.classList.toggle('active', b.dataset.v === st.tf));
      document.querySelectorAll(`#${p}-hour-container .chip`).forEach(b => b.classList.toggle('active', st.hour !== null && Number(b.dataset.v) === st.hour));
      document.querySelectorAll(`#${p}-period-container .chip`).forEach(b => b.classList.toggle('active', b.dataset.v === st.period));
      document.getElementById(`${p}-off-tf`).classList.toggle('active', st.tf === null);
      document.getElementById(`${p}-off-hour`).classList.toggle('active', st.hour === null);
      document.getElementById(`${p}-off-period`).classList.toggle('active', st.period === null);
    }

    function setOff(p, which) { S[p][which] = null; updateFilterUI(p); render(p); }
    function selTF(p, v) { S[p].tf = (S[p].tf === v) ? null : v; updateFilterUI(p); render(p); }
    function selHour(p, v) { S[p].hour = (S[p].hour === v) ? null : v; updateFilterUI(p); render(p); }
    function selPeriod(p, v) { S[p].period = (S[p].period === v) ? null : v; updateFilterUI(p); render(p); }

    function toggleParams() {
      S.op.allParams = !S.op.allParams;
      const b = document.getElementById('op-params-toggle');
      b.innerText = S.op.allParams ? 'Todos' : 'Só os que variam';
      b.classList.toggle('active', S.op.allParams);
      render('op');
    }

    // ---------- Clicar em um resultado ----------
    function selectRow(p, idx) {
      const r = S[p].visible[idx];
      if (!r) return;
      const k = selKey(r);
      S[p].selected = (S[p].selected === k) ? null : k;
      render(p);
    }

    // ---------- Apagar ----------
    let deleteFrom = 'bt';
    let deleteAllMode = false;

    function openModal() {
      const m = document.getElementById('del-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function setModalTexts(all, p) {
      const title = document.getElementById('del-title');
      const sub = document.getElementById('del-sub');
      const btn = document.getElementById('del-confirm');
      if (all) {
        const nome = (p === 'op') ? 'da OTIMIZAÇÃO' : 'dos BACKTESTS';
        title.innerText = `Você deseja apagar TODOS os resultados ${nome}?`;
        sub.innerText = 'Tudo será removido da planilha e não dá para desfazer.';
        btn.innerText = 'Sim, apagar tudo';
      } else {
        title.innerText = 'Você deseja apagar este resultado?';
        sub.innerText = 'Ele será removido da planilha e não dá para desfazer.';
        btn.innerText = 'Sim, apagar';
      }
    }

    function askDelete(p, idx) {
      deleteFrom = p;
      deleteAllMode = false;
      rowToDelete = S[p].visible[idx];
      if (!rowToDelete) return;
      setModalTexts(false, p);
      openModal();
    }

    function askDeleteAll(p) {
      if (S[p].rows.length === 0) {
        alert('Não há resultados para apagar nesta aba.');
        return;
      }
      deleteFrom = p;
      deleteAllMode = true;
      rowToDelete = null;
      setModalTexts(true, p);
      openModal();
    }

    function closeDelete() {
      const m = document.getElementById('del-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    async function confirmDelete() {
      const r = rowToDelete;
      const k = deleteFrom;
      const all = deleteAllMode;
      closeDelete();
      if (!all && !r) return;
      if (!DELETE_URL || DELETE_URL.startsWith('COLE')) {
        alert('Falta configurar o DELETE_URL no código do site.');
        return;
      }
      try {
        let payload;
        if (all) {
          payload = { token: DELETE_TOKEN, apagarTudo: true, tipo: k };
        } else if (k === 'op') {
          payload = { token: DELETE_TOKEN, passe: r.passe };
        } else {
          payload = { token: DELETE_TOKEN, dataHora: r.dataHora, lucro: r.lucroLiquido,
                      operacoes: r.operacoes, timeframe: r.timeframe };
        }

        const res = await fetch(DELETE_URL, { method: 'POST', body: JSON.stringify(payload) });
        const out = await res.json();
        if (!out.ok) { alert('Não foi possível apagar: ' + (out.erro || 'erro desconhecido')); return; }

        if (all) {
          if (k === 'bt') S.bt.rows.forEach(x => deletedKeys.add(rowKey(x)));
          S[k].rows = [];
          S[k].selected = null;
        } else {
          deletedKeys.add(rowKey(r));
          S[k].rows.splice(S[k].rows.indexOf(r), 1);
        }
        document.getElementById('count-' + k).innerText = S[k].rows.length;
        render(k);
      } catch (e) {
        alert('Erro ao apagar. Tente de novo.');
      }
    }

    // ---------- Buscar dados da planilha ----------
    async function fetchData() {
      try {
        const response = await fetch(CSV_URL + '&t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Falha na conexão');

        const data = await response.text();
        const rows = data.split(/\r?\n/).map(r => r.trim()).filter(r => r.length > 0);
        if (rows.length === 0) return;

        const firstCols = parseCSVLine(rows[0]);
        const startIdx = /^[\s$\-+0-9.,]+$/.test(firstCols[1] || '') ? 0 : 1;

        const parsed = [];
        const parsedOpt = [];
        for (let i = startIdx; i < rows.length; i++) {
          const cols = parseCSVLine(rows[i]);
          if (cols.length < 5) continue;

          const base = {
            dataHora:     cols[0] || '-',
            lucroLiquido: cleanNum(cols[1]),
            drawdown:     cleanNum(cols[2]),
            maiorLucro:   cleanNum(cols[3]),
            maiorPerda:   cleanNum(cols[4]),
            ganhosConsec: cleanNum(cols[5]),
            perdasConsec: cleanNum(cols[6]),
            operacoes:    Math.round(cleanNum(cols[7])),
            sharpe:       cleanNum(cols[8]),
            pctVitoria:   cleanNum(cols[9]),
            fatorEA:      cleanNum(cols[10]),
            timeframe:    (cols[11] || '').trim().toUpperCase() || '-'
          };

          if ((cols[12] || '').trim().toUpperCase() === 'OTIMIZACAO') {
            base.passe = (cols[13] || '').trim();
            base.params = parseParams(cols[14] || '');
            base.horas = horasDoPasse(base.params);
            parsedOpt.push(base);
          } else {
            parsed.push(base);
          }
        }

        const present = new Set(parsed.map(rowKey));
        deletedKeys.forEach(k => { if (!present.has(k)) deletedKeys.delete(k); });
        S.bt.rows = parsed.filter(r => !deletedKeys.has(rowKey(r)));
        S.op.rows = parsedOpt;

        document.getElementById('count-bt').innerText = S.bt.rows.length;
        document.getElementById('count-op').innerText = S.op.rows.length;

        render('bt');
        render('op');
        const st = document.getElementById('sync-text');
        if (st) st.innerText = 'Google Sheets Connected';
      } catch (err) {
        console.log('Aguardando sincronização com dados da planilha');
        const st = document.getElementById('sync-text');
        if (st) st.innerText = 'Aguardando planilha...';
      }
    }

    // ---------- Render (igual para as duas visões) ----------
    function render(p) {
      const st = S[p];
      const isOp = (p === 'op');

      let rows = st.rows;
      if (st.tf !== null) rows = rows.filter(r => r.timeframe === st.tf);
      if (isOp && st.hour !== null) rows = rows.filter(r => r.horas.has(st.hour));

      const totalFiltrado = rows.length;
      if (isOp) {
        const asc = (st.sort === 'drawdown');
        rows = rows.slice().sort((a, b) => asc ? a[st.sort] - b[st.sort] : b[st.sort] - a[st.sort]);
        if (st.limit > 0) rows = rows.slice(0, st.limit);
      }
      st.visible = rows;

      // se o selecionado sumiu (filtro, apagado...), limpa a seleção
      if (st.selected && !rows.some(r => selKey(r) === st.selected)) st.selected = null;

      // Parâmetros a exibir (só otimização)
      let names = [];
      if (isOp) {
        const base = S.op.rows.filter(r => (st.tf === null || r.timeframe === st.tf));
        if (st.allParams) {
          const set = new Set();
          base.forEach(r => Object.keys(r.params).forEach(k => set.add(k)));
          names = Array.from(set);
        } else {
          const first = {};
          const varying = new Set();
          base.forEach(r => Object.keys(r.params).forEach(k => {
            if (!(k in first)) first[k] = r.params[k];
            else if (first[k] !== r.params[k]) varying.add(k);
          }));
          names = Array.from(varying);
        }
        const info = document.getElementById('op-info');
        if (info) info.innerText = `Mostrando ${rows.length} de ${totalFiltrado} passes`;
      }

      const body = document.getElementById(`${p}-body`);
      const colSpan = 13;
      const parts = [];

      if (rows.length === 0) {
        const msg = isOp ? 'Nenhum passe de otimização encontrado para estes filtros.'
                         : 'Nenhum backtest encontrado para este timeframe.';
        parts.push(`<tr><td colspan="${colSpan}" class="text-slate-400 font-mono">${msg}</td></tr>`);
      }

      // ---------- Tabela ----------
      rows.forEach((r, idx) => {
        const isSel = st.selected === selKey(r);
        const selCls = isSel ? ' sel' : '';
        const click = `onclick="selectRow('${p}',${idx})"`;
        const lucroClass = r.lucroLiquido >= 0 ? 'val-positive font-num' : 'val-negative font-num';
        const ultima = `<td><button class="del-btn" onclick="event.stopPropagation(); askDelete('${p}',${idx})" title="Apagar resultado" aria-label="Apagar resultado">✕</button></td>`;
        const tags = isOp
          ? names.filter(n => n in r.params)
              .map(n => `<span class="ptag">${esc(n.replace(/^Inp/, ''))}=<b>${esc(r.params[n])}</b></span>`).join('')
          : '';

        parts.push(`<tr class="${isOp ? 'pt ' : ''}text-slate-200${selCls}" ${click}>
          <td class="font-mono text-slate-300 font-semibold">${esc(r.dataHora)}</td>
          <td class="${lucroClass}">$ ${fmtMoney(r.lucroLiquido)}</td>
          <td class="font-num val-negative">${r.drawdown.toFixed(2)}%</td>
          <td class="font-num val-positive">$ ${fmtMoney(r.maiorLucro)}</td>
          <td class="font-num val-negative">$ ${fmtMoney(r.maiorPerda)}</td>
          <td class="font-num val-positive">$ ${fmtMoney(r.ganhosConsec)}</td>
          <td class="font-num val-negative">$ ${fmtMoney(r.perdasConsec)}</td>
          <td class="font-num text-slate-200">${r.operacoes}</td>
          <td class="font-num val-cyan">${r.sharpe.toFixed(2)}</td>
          <td class="font-num val-positive">${r.pctVitoria.toFixed(2)}%</td>
          <td class="font-num text-slate-200">${r.fatorEA.toFixed(2)}</td>
          <td class="font-mono font-bold text-amber-400">${esc(r.timeframe)}</td>
          ${ultima}
        </tr>`);
        if (isOp) {
          parts.push(`<tr class="pb${selCls}" ${click}><td colspan="13" class="params-cell"><span class="text-slate-500 font-bold mr-2">PARÂMETROS</span>${tags || '<span class="text-slate-600">—</span>'}</td></tr><tr class="sp"><td colspan="13"></td></tr>`);
        }
      });
      body.innerHTML = parts.join('');

      // ---------- Cartões + gráfico (só o selecionado, se houver) ----------
      const calc = st.selected ? rows.filter(r => selKey(r) === st.selected) : rows;
      let totalLucro = 0, sumSharpe = 0, sumDD = 0, melhor = null;
      const points = [];
      const labels = [];
      calc.forEach(r => {
        const n = rows.indexOf(r) + 1;
        totalLucro += r.lucroLiquido;
        sumSharpe += r.sharpe;
        sumDD += r.drawdown;
        if (melhor === null || r.lucroLiquido > melhor) melhor = r.lucroLiquido;
        points.push(isOp ? r.lucroLiquido : totalLucro);
        labels.push(isOp ? `Passe #${n}` : `Run #${n}`);
      });

      const total = calc.length;
      const kpiValor = isOp ? (melhor === null ? 0 : melhor) : totalLucro;
      const kpiProfit = document.getElementById(`${p}-kpi-profit`);
      kpiProfit.innerText = `$ ${fmtMoney(kpiValor)}`;
      kpiProfit.className = `text-3xl font-extrabold font-mono tracking-tight ${total === 0 ? 'text-white' : (kpiValor >= 0 ? 'text-[#00ff87]' : 'text-[#ff1744]')}`;
      document.getElementById(`${p}-kpi-total`).innerText = st.selected ? 1 : (isOp ? totalFiltrado : rows.length);
      document.getElementById(`${p}-kpi-sharpe`).innerText = total ? (sumSharpe / total).toFixed(2) : '0.00';
      document.getElementById(`${p}-kpi-dd`).innerText = total ? `${(sumDD / total).toFixed(2)}%` : '0.00%';

      if (st.chart) {
        st.chart.data.labels = labels;
        st.chart.data.datasets[0].data = points;
        st.chart.data.datasets[0].pointRadius = (points.length === 1) ? 7 : 3;
        st.chart.update();
      }
    }

    // ---------- Gráfico ----------
    function initChart(p) {
      const ctx = document.getElementById(`${p}-chart`).getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 300);
      gradient.addColorStop(0, 'rgba(0, 242, 254, 0.35)');
      gradient.addColorStop(1, 'rgba(0, 242, 254, 0.0)');

      S[p].chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: CFG[p].chartLabel, data: [],
            borderColor: '#00f2fe', borderWidth: 2.5, backgroundColor: gradient,
            fill: true, tension: 0.35, pointBackgroundColor: '#00f2fe', pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 11 } } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 11 } } }
          }
        }
      });
    }

    window.onload = function () {
      document.getElementById('view-bt').innerHTML = viewHTML('bt');
      document.getElementById('view-op').innerHTML = viewHTML('op');
      updateFilterUI('bt');
      updateFilterUI('op');
      initChart('bt');
      initChart('op');
      fetchData();
      setInterval(fetchData, 30000);
    };
  </script>
</body>
</html>
